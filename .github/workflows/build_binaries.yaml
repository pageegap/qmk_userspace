name: Build QMK firmware

on: [push, workflow_dispatch]

permissions:
  contents: write

jobs:
  build:
    name: 'QMK Userspace Build'
    uses: qmk/.github/.github/workflows/qmk_userspace_build.yml@main
    with:
      qmk_repo: bastardkb/bastardkb-qmk
      qmk_ref: bc50f889c80773e96bfcb1249f137b676cf0eb5f

  publish:
    name: 'QMK Userspace Publish'
    uses: bastardkb/qmk_userspace/.github/workflows/qmk_userspace_publish.yml@main
    if: always() && !cancelled()
    needs: build
